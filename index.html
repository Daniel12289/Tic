<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Display</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial, sans-serif;
color:white;
}

/* Full screen sliding text */

.container{
position:absolute;
width:100%;
height:100vh;
display:flex;
align-items:center;
}

.slideText{
white-space:nowrap;
font-size:14vw;
font-weight:bold;
animation: slide 15s linear infinite;
text-shadow:0 0 30px red;
}

@keyframes slide{
from{transform:translateX(100%);}
to{transform:translateX(-100%);}
}

/* Floating hearts */

.heart{
position:absolute;
color:red;
animation: floatUp 6s linear infinite;
}

@keyframes floatUp{
0%{
transform:translateY(100vh) scale(0.5);

opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.5);
opacity:0;
}
}

</style>
</head>

<body>

<div class="container">
<div class="slideText">
❤️ Every moment with you feels like a beautiful dream. You are my heart, my happiness, and my everything. I love you more than words can ever express. ❤️🌹
</div>
</div>

<script>

function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*50+20)+"px";
heart.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
